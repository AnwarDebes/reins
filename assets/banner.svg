<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="REINS: Runtime Enforcement of INterpretable Specifications. Least-cost repair of LLM-agent tool calls, certified without the model.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16132e"/>
      <stop offset="0.55" stop-color="#0f1730"/>
      <stop offset="1" stop-color="#0a1426"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.18" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.86" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="steps" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="34" fill="#a5b4fc" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#steps)"/>
  <rect width="1200" height="320" fill="url(#glowL)"/>
  <rect width="1200" height="320" fill="url(#glowR)"/>

  <!-- wordmark + copy (left) -->
  <text x="70" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="108" font-weight="800" fill="url(#brand)" letter-spacing="3">REINS</text>
  <rect x="74" y="170" width="232" height="4" rx="2" fill="url(#brand)" opacity="0.85"/>
  <text x="76" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="23" font-weight="600" fill="#c7d2fe" letter-spacing="0.3">Runtime Enforcement of INterpretable Specifications</text>
  <text x="76" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="16.5" font-weight="400" fill="#94a3b8">Least-cost repair of LLM-agent tool calls, certified without the model.</text>
  <text x="76" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="15" font-weight="600" fill="#7dd3fc" letter-spacing="0.2">model-free<tspan fill="#475569" font-weight="400">  /  </tspan>CPU-only<tspan fill="#475569" font-weight="400">  /  </tspan>minimal-intervention<tspan fill="#475569" font-weight="400">  /  </tspan>tamper-evident certificate</text>

  <!-- the REINS story (right): a trajectory veers toward a violation, the
       least-cost INSERT edit bends it back into the safe lane, then it is certified -->
  <g transform="translate(0,4)">
    <!-- safe lane (the policy's safe language) -->
    <rect x="662" y="116" width="478" height="92" rx="46" fill="#10b981" opacity="0.09"/>
    <rect x="662.75" y="116.75" width="476.5" height="90.5" rx="45.25" fill="none"
          stroke="#34d399" stroke-width="1.4" stroke-dasharray="2 7" opacity="0.45"/>
    <text x="686" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="12.5" font-weight="600" fill="#6ee7b7" opacity="0.85" letter-spacing="1.5">SAFE LANGUAGE</text>

    <!-- the blocked / escaped alternative (what REINS avoids) -->
    <path d="M860 184 C 892 214, 912 234, 936 256" fill="none" stroke="#fb7185"
          stroke-width="2.2" stroke-dasharray="3 6" stroke-linecap="round" opacity="0.55"/>
    <g stroke="#fb7185" stroke-width="2.6" stroke-linecap="round" opacity="0.8">
      <line x1="930" y1="258" x2="944" y2="272"/>
      <line x1="944" y1="258" x2="930" y2="272"/>
    </g>

    <!-- agent trajectory, bent back into the lane by the edit -->
    <path d="M686 162 L 766 162 C 812 162, 836 192, 886 192 C 936 192, 962 152, 1014 158 L 1080 162"
          fill="none" stroke="url(#path)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#38bdf8">
      <circle cx="686" cy="162" r="6"/>
      <circle cx="766" cy="162" r="5"/>
      <circle cx="1014" cy="158" r="5"/>
    </g>

    <!-- the least-cost INSERT edit (the minimal nudge) -->
    <circle cx="886" cy="192" r="13" fill="#f59e0b" opacity="0.18"/>
    <circle cx="886" cy="192" r="8.5" fill="#f59e0b"/>
    <g stroke="#0a1426" stroke-width="2.4" stroke-linecap="round">
      <line x1="886" y1="187.5" x2="886" y2="196.5"/>
      <line x1="881.5" y1="192" x2="890.5" y2="192"/>
    </g>

    <!-- certificate of the enforcement action -->
    <circle cx="1104" cy="162" r="20" fill="#0b1526" stroke="#34d399" stroke-width="2.6"/>
    <circle cx="1104" cy="162" r="20" fill="none" stroke="#34d399" stroke-width="6" opacity="0.12"/>
    <path d="M1095 162 L1101 169 L1114 154" fill="none" stroke="#6ee7b7" stroke-width="3.2"
          stroke-linecap="round" stroke-linejoin="round"/>

    <text x="662" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="13" font-weight="400" fill="#94a3b8">veers toward a violation, bent back by the least-cost edit, then certified</text>
  </g>
</svg>
